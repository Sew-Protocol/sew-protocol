[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache-foundry"
libs = ["../../lib", "../../node_modules"]
include_paths = ["../.."]
auto_detect_remappings = false
solc = "0.8.37"
optimizer_runs = 1
via_ir = true
verbosity = 3
ffi = false
ast = true
remappings = [
  "@openzeppelin/=../../node_modules/@openzeppelin/",
  "forge-std/=../../lib/forge-std/src/",
  "halmos-cheatcodes/=../../lib/halmos-cheatcodes/"
]

[fuzz]
runs = 256
max_test_rejects = 65536
