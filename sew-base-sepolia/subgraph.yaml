specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: EscrowVault
    network: base-sepolia
    source:
      address: "0x13b8b7572c72b46879662BFEA53851cBeD3bC47a"
      abi: EscrowVault
      startBlock: 37907959
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppealBondProtocolFeeBpsUpdated
        - ClaimableBalanceSet
        - DisputeAutoCancelled
        - DisputeEscalated
        - DisputeOpened
        - EscrowCreated
        - EscrowResolved
        - EscrowSettingsUpdated
        - EscrowStateChanged
        - EscrowTransferAutoResult
        - EscrowWithdrawn
        - FeesWithdrawn
        - IncidentPauseTriggered
        - OperationFailure
        - PendingSettlementCancelled
        - PendingSettlementExecuted
        - PendingSettlementSet
        - ProtocolFeeCollected
        - ResolutionModuleActivated
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - SystemResumed
        - TimedActionTriggered
        - TimeoutConfigUpdated
        - YieldProtocolFeeBpsUpdated
      abis:
        - name: EscrowVault
          file: ./abis/EscrowVault.json
      eventHandlers:
        - event: AppealBondProtocolFeeBpsUpdated(uint256,uint256)
          handler: handleAppealBondProtocolFeeBpsUpdated
        - event: ClaimableBalanceSet(indexed uint256,indexed address,indexed address,uint256)
          handler: handleClaimableBalanceSet
        - event: DisputeAutoCancelled(indexed uint256,indexed address,uint256,uint8)
          handler: handleDisputeAutoCancelled
        - event: DisputeEscalated(indexed uint256,uint8,uint8,indexed address,indexed address)
          handler: handleDisputeEscalated
        - event: DisputeOpened(indexed uint256,indexed address,indexed address)
          handler: handleDisputeOpened
        - event: EscrowCreated(indexed uint256,indexed address,indexed address,address,uint256,uint256,uint256)
          handler: handleEscrowCreated
        - event: EscrowResolved(indexed uint256,indexed address,bytes32)
          handler: handleEscrowResolved
        - event: EscrowSettingsUpdated(indexed uint256,(address,address,uint8,uint256,uint256))
          handler: handleEscrowSettingsUpdated
        - event: EscrowStateChanged(indexed uint256,uint8,uint8)
          handler: handleEscrowStateChanged
        - event: EscrowTransferAutoResult(indexed uint256,indexed address,indexed address,uint256,bool,uint8)
          handler: handleEscrowTransferAutoResult
        - event: EscrowWithdrawn(indexed uint256,indexed address,indexed address,uint256)
          handler: handleEscrowWithdrawn
        - event: FeesWithdrawn(indexed address,uint256)
          handler: handleFeesWithdrawn
        - event: IncidentPauseTriggered(string,uint256,uint256)
          handler: handleIncidentPauseTriggered
        - event: OperationFailure(indexed uint8,indexed uint256,indexed address,bytes4,uint8)
          handler: handleOperationFailure
        - event: PendingSettlementCancelled(indexed uint256)
          handler: handlePendingSettlementCancelled
        - event: PendingSettlementExecuted(indexed uint256,bool)
          handler: handlePendingSettlementExecuted
        - event: PendingSettlementSet(indexed uint256,bool,uint256)
          handler: handlePendingSettlementSet
        - event: ProtocolFeeCollected(indexed uint8,indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleProtocolFeeCollected
        - event: ResolutionModuleActivated(indexed address,indexed address)
          handler: handleResolutionModuleActivated
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: SystemResumed(uint256)
          handler: handleSystemResumed
        - event: TimedActionTriggered(indexed uint256,uint8,uint8,indexed address)
          handler: handleTimedActionTriggered
        - event: TimeoutConfigUpdated((uint256,uint256,uint256,uint256))
          handler: handleTimeoutConfigUpdated
        - event: YieldProtocolFeeBpsUpdated(uint256,uint256)
          handler: handleYieldProtocolFeeBpsUpdated
      file: ./src/escrow-vault.ts
