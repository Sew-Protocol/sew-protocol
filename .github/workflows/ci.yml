name: CI

on:
  pull_request:
  push:
    branches:
      - appeal-primitive
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.10.0

      - name: Fetch Foundry dependencies
        run: bash scripts/fetch-foundry-deps.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit

      - name: Compile (Hardhat + Forge)
        run: pnpm compile

      - name: Tests (Foundry)
        run: pnpm test:foundry

      - name: Sew core scoped qualification
        run: |
          pnpm --filter @sew/sew-core source:check
          pnpm --filter @sew/sew-core build
          pnpm --filter @sew/sew-core test:profile
          pnpm --filter @sew/sew-core deployables:export
          pnpm --filter @sew/sew-core deployables:validate
          pnpm --filter @sew/sew-core test:artifacts

      - name: Full-appeal artifact qualification
        run: pnpm deployables:test:sew-full-appeal
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Export full-appeal review bundle
        run: >-
          pnpm deployables:export --
          config/deployable-allowlist.sew-full-appeal.json
          /tmp/sew-full-appeal-review
          --out-dir out
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Upload full-appeal review bundle
        uses: actions/upload-artifact@v4
        with:
          name: sew-full-appeal-${{ github.sha }}
          path: /tmp/sew-full-appeal-review
          if-no-files-found: error
          retention-days: 90

      - name: Contract size check
        run: pnpm size:check

      - name: Export deployable artifacts
        run: pnpm deployables:export
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Validate deployables
        run: pnpm deployables:validate

      - name: Deployables tests (integrity + determinism)
        run: pnpm deployables:test
        env:
          GIT_SHA: ${{ github.sha }}

  independent-full-appeal-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout clean source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.10.0

      - name: Fetch Foundry dependencies
        run: bash scripts/fetch-foundry-deps.sh

      - name: Fresh Forge build
        run: forge build --force

      - name: Export independently rebuilt Full Appeal bundle
        run: >-
          pnpm deployables:export --
          config/deployable-allowlist.sew-full-appeal.json
          /tmp/sew-full-appeal-rebuilt
          --out-dir out
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Download CI reference bundle
        uses: actions/download-artifact@v4
        with:
          name: sew-full-appeal-${{ github.sha }}
          path: /tmp/sew-full-appeal-reference

      - name: Compare independent build commitments
        run: |
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("/tmp/sew-full-appeal-reference/manifest.json","utf8")); const b=JSON.parse(fs.readFileSync("/tmp/sew-full-appeal-rebuilt/manifest.json","utf8")); if (a.source.commit !== b.source.commit) throw new Error("source revisions differ"); if (a.bundleRoot !== b.bundleRoot) throw new Error(`bundle roots differ: ${a.bundleRoot} != ${b.bundleRoot}`); console.log(`independent clean-checkout build reproduced ${b.bundleRoot}`);'
