name: CI

on:
  pull_request:
  push:
    branches:
      - appeal-primitive

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Fetch Foundry dependencies
        run: bash scripts/fetch-foundry-deps.sh

      - name: Lint
        run: pnpm lint

      # Typecheck is currently non-gating: the tsconfig includes deploy/** and
      # scripts/** which carry ~86 pre-existing errors (contracts obtained via
      # deployments.get()/getContractAt typed as generic BaseContract, losing
      # typed methods). These span production deploy scripts and legacy
      # testnet scripts. Tracked as dedicated type-debt repair; keep this step
      # running for visibility but do not block merges until that repair lands.
      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Compile (Hardhat + Forge)
        run: pnpm compile

      - name: Tests (Foundry)
        run: pnpm test:foundry

      - name: Contract size check
        run: pnpm size:check

      - name: Export deployable artifacts
        run: pnpm deployables:export
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Validate deployables
        run: pnpm deployables:validate

      - name: Deployables tests (integrity + determinism)
        run: pnpm deployables:test
        env:
          GIT_SHA: ${{ github.sha }}
