name: CI

on:
  pull_request:
  push:
    branches:
      - appeal-primitive
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Fetch Foundry dependencies
        run: bash scripts/fetch-foundry-deps.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit

      - name: Compile (Hardhat + Forge)
        run: pnpm compile

      - name: Tests (Foundry)
        run: pnpm test:foundry

      - name: Sew core scoped qualification
        run: |
          pnpm --filter @sew/sew-core source:check
          pnpm --filter @sew/sew-core build
          pnpm --filter @sew/sew-core test:profile
          pnpm --filter @sew/sew-core deployables:export
          pnpm --filter @sew/sew-core deployables:validate
          pnpm --filter @sew/sew-core test:artifacts

      - name: Contract size check
        run: pnpm size:check

      - name: Export deployable artifacts
        run: pnpm deployables:export
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Validate deployables
        run: pnpm deployables:validate

      - name: Deployables tests (integrity + determinism)
        run: pnpm deployables:test
        env:
          GIT_SHA: ${{ github.sha }}
