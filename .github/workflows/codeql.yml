name: CodeQL

on:
  pull_request:
  push:
    branches: [appeal-primitive]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # Cache the pnpm store across runs (GitHub-recommended actions/cache).
      # setup-node's `cache: pnpm` above handles dependency restore on its own;
      # this store cache additionally avoids re-downloading on rebuilds.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results

      # Upload the SARIF so results are downloadable from the run
      # (GitHub-recommended actions/upload-artifact).
      - name: Upload CodeQL results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: ignore
