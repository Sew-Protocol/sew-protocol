[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
libs = ["lib"]
cache_path = "cache-foundry"
solc = "0.8.33"
optimizer_runs = 5
via_ir = true
verbosity = 3
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.coverage]
via_ir = true
optimizer = true
optimizer_runs = 1

[fuzz]
runs = 256
max_test_rejects = 65536

[rpc_endpoints]
base_sepolia = "${RPC_BASE_SEPOLIA}"
base = "${RPC_BASE_MAINNET}"
ethereum = "${RPC_ETHEREUM}"
