[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
libs = ["lib"]
cache_path = "cache-foundry"
solc = "0.8.33"
optimizer = true
# Keep runs low to minimize deployed bytecode size (EIP-170).
# Higher runs often increase runtime bytecode size (optimize for gas instead).
optimizer_runs = 200
via_ir = true
verbosity = 3
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.coverage]
# Use IR + optimizer for coverage to avoid stack-too-deep in complex contracts
via_ir = true
optimizer = true
optimizer_runs = 1

[fuzz]
runs = 256
max_test_rejects = 65536
