[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
libs = ["lib"]
cache_path = "cache-foundry"
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = true
verbosity = 3
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.coverage]
# Use IR + optimizer for coverage to avoid stack-too-deep in complex contracts
via_ir = true
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256
max_test_rejects = 65536
