packages: []
# Approve native build scripts (pnpm 9 mechanism). keccak / secp256k1 are
# transitive native (build-script) dependencies pulled in via ethers/hardhat.
# Without approving them, pnpm 9 would not run their postinstall builds and the
# toolchain would fail at runtime.
onlyBuiltDependencies:
  - keccak
  - secp256k1
