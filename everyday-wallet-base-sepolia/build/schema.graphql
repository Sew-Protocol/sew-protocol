# Escrow States
enum EscrowState {
  NONE
  PENDING
  RELEASED
  REFUNDED
  DISPUTED
  RESOLVED
}

# Escrow Entity
type Escrow @entity(immutable: true) {
  id: ID! # workflowId
  token: Bytes!
  sender: Bytes!
  recipient: Bytes!
  amountAfterFee: BigInt!
  fee: BigInt!
  state: EscrowState!
  disputeResolver: Bytes
  autoReleaseTime: BigInt
  autoCancelTime: BigInt
  createdAt: BigInt!
  releasedAt: BigInt
  refundedAt: BigInt
  disputedAt: BigInt
  resolvedAt: BigInt
}

# Track state changes
type EscrowStateChange @entity(immutable: true) {
  id: String! # workflowId + "-" + blockHash
  workflowId: BigInt!
  fromState: EscrowState!
  toState: EscrowState!
  transactionHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

# Track withdrawals
type EscrowWithdrawal @entity(immutable: true) {
  id: String! # workflowId + "-" + transactionHash
  workflowId: BigInt!
  recipient: Bytes!
  token: Bytes!
  amount: BigInt!
  transactionHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

# Dispute Entity
type Dispute @entity(immutable: true) {
  id: ID! # workflowId
  escrow: Escrow!
  resolver: Bytes!
  raisedBy: Bytes!
  raisedAt: BigInt!
  escalated: Boolean!
  escalationLevel: Int
  resolvedAt: BigInt
  resolutionHash: Bytes
}

# Escalation Entity
type DisputeEscalation @entity(immutable: true) {
  id: String! # workflowId + "-" + transactionHash
  dispute: Dispute!
  fromLevel: Int!
  toLevel: Int!
  newResolver: Bytes!
  escalatedBy: Bytes!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# Resolution Entity
type Resolution @entity(immutable: true) {
  id: ID! # workflowId
  escrow: Escrow!
  resolver: Bytes!
  isRelease: Boolean!
  resolutionHash: Bytes!
  timestamp: BigInt!
}

# Protocol Fee Entity
type ProtocolFee @entity(immutable: true) {
  id: String! # workflowId + "-" + kind
  kind: Int! # 0 = yield, 1 = appeal bond
  workflowId: BigInt!
  token: Bytes!
  grossAmount: BigInt!
  feeBps: BigInt!
  feeAmount: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# Timed Action Entity
type TimedAction @entity(immutable: true) {
  id: String! # workflowId + "-" + transactionHash
  workflowId: BigInt!
  actionType: Int! # 1 = release, 2 = cancel, 3 = settle
  source: Int! # 0 = user, 1 = keeper, 2 = governance
  executor: Bytes!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# Claimable Balance Entity
type ClaimableBalance @entity(immutable: true) {
  id: String! # workflowId + "-" + recipient + "-" + token
  workflowId: BigInt!
  recipient: Bytes!
  token: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# Pending Settlement Entity
type PendingSettlement @entity(immutable: true) {
  id: String! # workflowId
  workflowId: BigInt!
  isRelease: Boolean!
  appealDeadline: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# Token Holder
type TokenHolder @entity(immutable: false) {
  id: ID! # address
  balance: BigInt!
  delegate: Bytes
}

# Token Transfer
type TokenTransfer @entity(immutable: true) {
  id: String! # transactionHash + logIndex
  from: Bytes!
  to: Bytes!
  value: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Delegate Change
type DelegateChange @entity(immutable: true) {
  id: String! # transactionHash + logIndex
  delegator: Bytes!
  fromDelegate: Bytes!
  toDelegate: Bytes!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# Delegate Votes
type DelegateVotes @entity(immutable: false) {
  id: ID! # address
  votes: BigInt!
  checkpoint: BigInt!
}

# Module Snapshot
type ModuleSnapshot @entity(immutable: true) {
  id: String! # workflowId + "-" + moduleType
  workflowId: BigInt!
  moduleType: Int!
  moduleAddress: Bytes!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# Module Change
type ModuleChange @entity(immutable: true) {
  id: String! # transactionHash + logIndex
  moduleType: Int!
  oldModule: Bytes!
  newModule: Bytes!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# Governance Proposal
type Proposal @entity(immutable: false) {
  id: ID! # proposalId
  proposer: Bytes!
  targets: [Bytes!]!
  values: [BigInt!]!
  signatures: [String!]!
  calldatas: [Bytes!]!
  startBlock: BigInt!
  endBlock: BigInt!
  description: String!
  state: String!
  createdAt: BigInt!
  executedAt: BigInt
  canceledAt: BigInt
}

# Vote
type Vote @entity(immutable: true) {
  id: String! # proposalId + voter
  proposal: Proposal!
  voter: Bytes!
  support: Int!
  votes: BigInt!
  reason: String
  timestamp: BigInt!
  transactionHash: Bytes!
}
